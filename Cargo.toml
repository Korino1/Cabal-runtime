[package]
name = "cabal-observe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic build and test log normalization for Cabal Runtime"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["crates/cabal-delta", "crates/cabal-file-cache", "crates/cabal-log", "crates/cabal-runtime-hook"]
resolver = "3"
