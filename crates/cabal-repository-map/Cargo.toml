[package]
name = "cabal-repository-map"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic, incremental repository facts for Cabal Runtime"
license = "MIT OR Apache-2.0"

[dependencies]
cargo_metadata = "0.19"
cap-std = "4.0.2"
fs2 = "0.4"
ignore = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }

[dev-dependencies]
tempfile = "3"
