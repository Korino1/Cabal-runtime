[package]
name = "cabal-runtime-hook"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "Invisible Codex PostToolUse projection runtime for Cabal Runtime"
license = "MIT OR Apache-2.0"

[dependencies]
cabal-observe = { path = "../.." }
cabal-delta = { path = "../cabal-delta" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
