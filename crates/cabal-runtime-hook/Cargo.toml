[package]
name = "cabal-runtime-hook"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Native Codex PreToolUse Cargo context gateway for Cabal Runtime"
license = "MIT OR Apache-2.0"

[dependencies]
cabal-observe = { path = "../.." }
cabal-delta = { path = "../cabal-delta" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
