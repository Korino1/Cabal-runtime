[package]
name = "cabal-runtime-hook"
version = "0.9.1"
edition = "2024"
rust-version = "1.85"
description = "Native Codex context gateway with deterministic causal source projection"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
cabal-observe = { path = "../.." }
cabal-causal-context = { path = "../cabal-causal-context" }
cabal-change-policy = { path = "../cabal-change-policy" }
cabal-completion-gate = { path = "../cabal-completion-gate" }
cabal-delta = { path = "../cabal-delta" }
cabal-file-cache = { path = "../cabal-file-cache" }
cabal-log = { path = "../cabal-log" }
cabal-repository-map = { path = "../cabal-repository-map" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
