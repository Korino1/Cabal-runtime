[package]
name = "cabal-completion-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic opt-in completion evidence gate for Cabal Runtime"
license = "MIT OR Apache-2.0"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
