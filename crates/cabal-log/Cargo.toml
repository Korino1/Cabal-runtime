[package]
name = "cabal-log"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic normalization of CI and test logs"
license = "MIT OR Apache-2.0"

[dependencies]
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
