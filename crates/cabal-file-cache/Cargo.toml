[package]
name = "cabal-file-cache"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Session-aware bounded text file observation cache"
license = "MIT OR Apache-2.0"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
